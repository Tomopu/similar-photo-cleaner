<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スワイプで仕分け</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px; padding-bottom: 34px">
  <div class="nav">
    <a href="03-home.html" class="icon-btn glass" aria-label="閉じる"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <span class="nav-title">2026年10月</span>
    <span class="caption num" style="min-width: 44px; text-align: right">23 / 168</span>
  </div>
  <div style="height: 4px; border-radius: 2px; background: var(--surface-2); margin-top: 10px; overflow: hidden" aria-hidden="true">
    <div style="width: 14%; height: 100%; background: var(--keep-text)"></div>
  </div>

  <div style="position: relative; height: 492px; margin-top: 22px">
    <div class="ph p-sea" style="position: absolute; left: 18px; right: 18px; top: 18px; height: 470px; border-radius: 26px; opacity: 0.35"></div>
    <div class="ph p-forest" style="position: absolute; left: 9px; right: 9px; top: 9px; height: 476px; border-radius: 26px; opacity: 0.6"></div>
    <article style="position: absolute; left: 0; right: 0; top: 0; height: 482px; border-radius: 26px; overflow: hidden; transform: translateX(-12px) rotate(-5deg); transform-origin: 50% 100%; box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55)">
      <div class="ph p-sand" style="position: absolute; inset: 0; border-radius: 0"></div>
      <div style="position: absolute; inset: 0; background: rgba(242, 138, 60, 0.18)"></div>
      <span style="position: absolute; right: 22px; top: 26px; transform: rotate(12deg); border: 3px solid var(--delete); color: var(--delete); background: rgba(14, 15, 17, 0.6); border-radius: 10px; padding: 4px 12px; font-size: 22px; font-weight: 800; letter-spacing: 1px">削除</span>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 22px 22px; background: linear-gradient(180deg, rgba(14, 15, 17, 0) 0%, rgba(14, 15, 17, 0.85) 100%); display: flex; flex-direction: column; gap: 6px">
        <span class="headline num" style="color: #F3F3F0">10月4日 11:20</span>
        <div style="display: flex; gap: 6px">
          <span class="chip num" style="background: rgba(255, 255, 255, 0.16); color: #F3F3F0">4.2 MB</span>
          <span class="chip" style="background: rgba(255, 255, 255, 0.16); color: #F3F3F0">似た写真 3枚のうち1枚</span>
        </div>
      </div>
    </article>
  </div>

  <div style="margin-top: auto; display: flex; align-items: flex-end; justify-content: center; gap: 22px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button class="icon-btn glass" type="button" aria-label="取り消し" style="width: 48px; height: 48px; border-radius: 24px"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <span class="caption" style="font-size: 11px">取り消し</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button type="button" aria-label="削除予定に入れる" style="width: 68px; height: 68px; border-radius: 34px; border: 0; background: var(--delete); color: var(--delete-ink); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke-width: 2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <span class="caption" style="font-size: 11px">削除</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button class="icon-btn glass" type="button" aria-label="保留" style="width: 52px; height: 52px; border-radius: 26px"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <span class="caption" style="font-size: 11px">保留</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button type="button" aria-label="残す" style="width: 68px; height: 68px; border-radius: 34px; border: 0; background: var(--keep); color: var(--on-keep); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 28px; height: 28px; stroke-width: 2.2"><path d="M5 12.5 10 17l9-10"/></svg></button>
      <span class="caption" style="font-size: 11px">残す</span>
    </div>
  </div>
  <p class="caption num" style="text-align: center; margin-top: 14px">削除予定 12枚 · 180 MB</p>
</main>
</body>
</html>
