<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スキャン中</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px; padding-bottom: 34px">
  <h1 class="large-title">写真を解析中</h1>
  <p class="body" style="margin-top: 6px">似た写真とスクリーンショットを探しています</p>

  <div style="position: relative; width: 240px; height: 240px; margin: 44px auto 0">
    <svg viewBox="0 0 240 240" width="240" height="240" aria-hidden="true" style="transform: rotate(-90deg)">
      <circle cx="120" cy="120" r="104" fill="none" stroke-width="14" style="stroke: var(--surface-2)"/>
      <circle cx="120" cy="120" r="104" fill="none" stroke-width="14" style="stroke: var(--keep)" stroke-linecap="round" stroke-dasharray="399 654"/>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <span class="num" style="font-size: 52px; font-weight: 700; letter-spacing: -1px">61%</span>
      <span class="caption num">12,480 / 20,312枚</span>
    </div>
  </div>

  <p class="caption" style="text-align: center; margin-top: 18px">残り 約6分</p>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 32px">
    <div class="card" style="display: flex; flex-direction: column; gap: 6px">
      <span class="caption">似た写真のグループ</span>
      <span class="num" style="font-size: 28px; font-weight: 700">132</span>
    </div>
    <div class="card" style="display: flex; flex-direction: column; gap: 6px">
      <span class="caption">スクリーンショット</span>
      <span class="num" style="font-size: 28px; font-weight: 700">1,420<span style="font-size: 15px; font-weight: 600">枚</span></span>
    </div>
  </div>

  <div style="display: flex; gap: 12px; align-items: flex-start; margin-top: 20px; padding: 0 4px">
    <span style="color: var(--text-2)"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
    <p class="caption">アプリを閉じても解析は続きます。進み具合はロック画面に表示されます。</p>
  </div>

  <div style="margin-top: auto">
    <button class="btn btn-ghost" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>一時停止</button>
  </div>
</main>
</body>
</html>
