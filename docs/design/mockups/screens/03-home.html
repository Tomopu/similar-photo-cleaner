<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーム</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px">
  <h1 class="large-title">整理</h1>

  <section class="card" style="margin-top: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px" aria-label="削減できる容量">
    <span class="caption">削減できる容量</span>
    <span class="num" style="font-size: 56px; font-weight: 700; letter-spacing: -1.5px; line-height: 1">5.0<span style="font-size: 24px; font-weight: 600; letter-spacing: 0; margin-left: 4px">GB</span></span>
    <div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 3px" aria-hidden="true">
      <div style="flex: 38; background: var(--keep)"></div>
      <div style="flex: 12; background: var(--chart-2)"></div>
      <div style="flex: 30; background: var(--line)"></div>
    </div>
    <div style="display: flex; gap: 16px">
      <span class="caption" style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--keep)"></span>似た写真 3.8 GB</span>
      <span class="caption" style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--chart-2)"></span>スクショ 1.2 GB</span>
    </div>
    <span class="caption">最終スキャン 今日 9:12</span>
  </section>

  <h2 class="headline" style="margin-top: 28px; font-size: 20px; font-weight: 700">整理のしかた</h2>
  <nav style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px" aria-label="整理モード">
    <a href="04-similar-groups.html" class="card" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; padding: 14px 16px">
      <div style="position: relative; width: 52px; height: 52px">
        <div class="ph p-sunset" style="position: absolute; left: 8px; top: 0; width: 44px; height: 44px; border-radius: 8px; opacity: 0.6"></div>
        <div class="ph p-people" style="position: absolute; left: 0; top: 8px; width: 44px; height: 44px; border-radius: 8px"></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span class="headline">似た写真を比べる</span>
        <span class="caption num">214グループ · 3.8 GB</span>
      </div>
      <svg class="i" viewBox="0 0 24 24" style="color: var(--text-2)"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a href="06-swipe.html" class="card" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; padding: 14px 16px">
      <div style="width: 52px; height: 52px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--keep-text)">
        <svg class="i" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M3 7v10M21 7v10"/></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span class="headline">スワイプで仕分ける</span>
        <span class="caption">月ごとに1枚ずつ、残すか決める</span>
      </div>
      <svg class="i" viewBox="0 0 24 24" style="color: var(--text-2)"><path d="M9 5l7 7-7 7"/></svg>
    </a>
    <a href="07-screenshots.html" class="card" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; padding: 14px 16px">
      <div style="width: 52px; height: 52px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--keep-text)">
        <svg class="i" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span class="headline">スクリーンショット</span>
        <span class="caption num">1,420枚 · 1.2 GB</span>
      </div>
      <svg class="i" viewBox="0 0 24 24" style="color: var(--text-2)"><path d="M9 5l7 7-7 7"/></svg>
    </a>
  </nav>

  <a href="10-history.html" class="card" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; padding: 14px 16px; margin-top: 10px">
    <div style="width: 52px; height: 52px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--keep-text)">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span class="headline">これまでの実績</span>
      <span class="caption num">4,812枚 · 12.6 GB を削減</span>
    </div>
    <svg class="i" viewBox="0 0 24 24" style="color: var(--text-2)"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <nav class="tabbar glass" aria-label="タブ">
    <a href="03-home.html" class="tab" style="text-decoration: none" aria-current="page"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/></svg>整理</a>
    <a href="08-tray.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>削除予定<span class="badge num">348</span></a>
    <a href="10-history.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg>実績</a>
    <a href="11-settings.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</a>
  </nav>
</main>
</body>
</html>
