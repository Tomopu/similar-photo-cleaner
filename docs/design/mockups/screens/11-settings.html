<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px">
  <h1 class="large-title">設定</h1>

  <h2 class="section-label" style="margin-top: 18px">表示</h2>
  <div class="group">
    <div class="row" style="min-height: 60px">
      <span>外観</span>
      <div class="segmented" style="width: 186px" role="group" aria-label="外観">
        <button type="button" aria-pressed="true">自動</button>
        <button type="button" aria-pressed="false">ライト</button>
        <button type="button" aria-pressed="false">ダーク</button>
      </div>
    </div>
  </div>

  <h2 class="section-label" style="margin-top: 20px">似た写真の判定</h2>
  <div class="group" style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <label for="sensitivity" style="display: flex; justify-content: space-between; font-size: 16px"><span>まとめる範囲</span><span class="caption" style="font-size: 15px">標準</span></label>
    <div style="position: relative; height: 28px; display: flex; align-items: center">
      <div style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--surface-2)"></div>
      <div style="position: absolute; left: 0; width: 50%; height: 4px; border-radius: 2px; background: var(--keep)"></div>
      <div style="position: absolute; left: calc(50% - 14px); width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3)"></div>
      <input id="sensitivity" type="range" min="0" max="2" value="1" aria-valuetext="標準" style="position: absolute; inset: 0; width: 100%; opacity: 0; margin: 0">
    </div>
    <div style="display: flex; justify-content: space-between"><span class="caption">ほぼ同じだけ</span><span class="caption">広めにまとめる</span></div>
  </div>

  <h2 class="section-label" style="margin-top: 20px">削除候補にしない写真</h2>
  <div class="group">
    <div class="row"><span>お気に入り</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="お気に入りを除外"></button></div>
    <div class="row"><span>編集した写真</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="編集した写真を除外"></button></div>
    <div class="row"><span>共有アルバムの写真</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="共有アルバムの写真を除外"></button></div>
  </div>

  <h2 class="section-label" style="margin-top: 20px">スキャン</h2>
  <div class="group">
    <div class="row"><span>充電中に自動でスキャン</span><button class="switch" type="button" role="switch" aria-checked="true" aria-label="充電中に自動でスキャン"></button></div>
    <div class="row"><span>新しい候補を通知</span><button class="switch" type="button" role="switch" aria-checked="false" aria-label="新しい候補を通知"></button></div>
  </div>

  <h2 class="section-label" style="margin-top: 20px">データ</h2>
  <div class="group">
    <div class="row"><span>解析データ</span><span class="caption num" style="font-size: 15px">42 MB</span></div>
    <div class="row"><button type="button" style="border: 0; background: none; padding: 0; font: inherit; font-size: 16px; color: var(--keep-text); min-height: 44px">最初からスキャンし直す</button></div>
  </div>
  <p class="caption" style="margin: 10px 16px 0">写真と解析データはこのiPhoneの外に送信されません。バージョン 0.1.0</p>

  <nav class="tabbar glass" aria-label="タブ">
    <a href="03-home.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/></svg>整理</a>
    <a href="08-tray.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>削除予定<span class="badge num">348</span></a>
    <a href="10-history.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg>実績</a>
    <a href="11-settings.html" class="tab" style="text-decoration: none" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</a>
  </nav>
</main>
</body>
</html>
