        <text x="22" y="112.5">1</text>
        <text x="22" y="144">0</text>

      <g style="fill: var(--chart)">
        <path d="M40 140V46.35Q40 42.35 44 42.35H64Q68 42.35 68 46.35V140Z"/>

    <h2 class="headline" style="font-size: 15px">整理の種別</h2>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 14px">似た写真</span><span class="num" style="font-size: 14px; font-weight: 600">7.9 GB</span></div>

    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 14px">スクリーンショット</span><span class="num" style="font-size: 14px; font-weight: 600">2.9 GB</span></div>
      <div style="height: 6px; border-radius: 3px; background: var(--surface-2)"><div style="width: 36.7%; height: 100%; border-radius: 3px; background: var(--chart)"></div></div>

    <li class="row"><span class="num">9月3日</span><span class="caption num">210枚 · 1.2 GB</span></li>
