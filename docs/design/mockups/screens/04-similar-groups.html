<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>似た写真のグループ一覧</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px">
  <div class="nav">
    <a href="03-home.html" class="icon-btn glass" aria-label="戻る"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span class="nav-title">似た写真</span>
    <span style="width: 44px"></span>
  </div>

  <p class="caption num" style="margin-top: 12px">214グループ · 3.8 GB を減らせます</p>
  <div class="segmented" style="margin-top: 12px" role="group" aria-label="並び順">
    <button type="button" aria-pressed="true">減らせる容量順</button>
    <button type="button" aria-pressed="false">新しい順</button>
  </div>

  <ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
    <li>
      <a href="05-compare.html" class="card" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; padding: 14px">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <div class="ph r8 p-people" style="position: relative; height: 76px"><span class="chip chip-keep" style="position: absolute; left: 5px; bottom: 5px; height: 20px; font-size: 10px; padding: 0 7px; border-radius: 3px">ベスト</span></div>
          <div class="ph r8 p-people-blur" style="height: 76px"></div>
          <div class="ph r8 p-people" style="height: 76px; filter: brightness(0.85)"></div>
          <div class="ph r8 p-people-blur" style="height: 76px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700"><span style="background: rgba(0, 0, 0, 0.45); padding: 2px 8px; border-radius: 3px">+4</span></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span class="headline" style="font-size: 16px">10月12日 14:05</span>
            <span class="caption num">8枚 · 7枚を削除候補</span>
          </div>
          <span class="num delete-text" style="font-size: 15px; font-weight: 700">−42 MB</span>
        </div>
      </a>
    </li>
    <li>
      <a href="05-compare.html" class="card" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; padding: 14px">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <div class="ph r8 p-sunset" style="position: relative; height: 76px"><span class="chip chip-keep" style="position: absolute; left: 5px; bottom: 5px; height: 20px; font-size: 10px; padding: 0 7px; border-radius: 3px">ベスト</span></div>
          <div class="ph r8 p-sunset" style="height: 76px; filter: brightness(0.8)"></div>
          <div class="ph r8 p-sunset" style="height: 76px; filter: saturate(0.7)"></div>
          <div class="ph r8 p-sunset" style="height: 76px; filter: brightness(1.1)"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span class="headline" style="font-size: 16px">9月28日 17:48</span>
            <span class="caption num">4枚 · 3枚を削除候補</span>
          </div>
          <span class="num delete-text" style="font-size: 15px; font-weight: 700">−19 MB</span>
        </div>
      </a>
    </li>
    <li>
      <a href="05-compare.html" class="card" style="display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; padding: 14px">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <div class="ph r8 p-cafe" style="position: relative; height: 76px"><span class="chip chip-keep" style="position: absolute; left: 5px; bottom: 5px; height: 20px; font-size: 10px; padding: 0 7px; border-radius: 3px">ベスト</span></div>
          <div class="ph r8 p-cafe" style="height: 76px; filter: brightness(0.85)"></div>
          <div class="ph r8 p-cafe" style="height: 76px; filter: blur(1.5px)"></div>
          <div style="height: 76px"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span class="headline" style="font-size: 16px">9月21日 12:30</span>
            <span class="caption num">3枚 · 2枚を削除候補</span>
          </div>
          <span class="num delete-text" style="font-size: 15px; font-weight: 700">−11 MB</span>
        </div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
