<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>削除予定トレイ</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px">
  <h1 class="large-title">削除予定</h1>
  <p class="num" style="margin: 6px 0 0; font-size: 17px; font-weight: 600">348枚 · <span class="delete-text">1.4 GB</span></p>

  <section style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px" aria-label="似た写真から">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 class="headline" style="font-size: 15px">似た写真から</h2>
      <span class="caption num">31枚 · 0.9 GB</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <div class="ph p-people-blur" style="height: 64px"></div>
      <div class="ph p-sunset" style="height: 64px; filter: brightness(0.8)"></div>
      <div class="ph p-cafe" style="height: 64px; filter: blur(1px)"></div>
      <div class="ph p-people" style="height: 64px; filter: brightness(0.85)"></div>
      <div class="ph p-city" style="height: 64px; display: flex; align-items: center; justify-content: center; font-weight: 700"><span style="background: rgba(0, 0, 0, 0.45); padding: 2px 8px; border-radius: 8px">+27</span></div>
    </div>
  </section>

  <section style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px" aria-label="スワイプから">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 class="headline" style="font-size: 15px">スワイプから</h2>
      <span class="caption num">12枚 · 0.2 GB</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <div class="ph p-sand" style="height: 64px"></div>
      <div class="ph p-snow" style="height: 64px"></div>
      <div class="ph p-forest" style="height: 64px"></div>
      <div class="ph p-night" style="height: 64px"></div>
      <div class="ph p-sea" style="height: 64px; display: flex; align-items: center; justify-content: center; font-weight: 700"><span style="background: rgba(0, 0, 0, 0.45); padding: 2px 8px; border-radius: 8px">+8</span></div>
    </div>
  </section>

  <section style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px" aria-label="スクリーンショット">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 class="headline" style="font-size: 15px">スクリーンショット</h2>
      <span class="caption num">305枚 · 0.3 GB</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
      <div class="shot" style="height: 64px"></div>
      <div class="shot-dark" style="height: 64px"></div>
      <div class="shot" style="height: 64px"></div>
      <div class="shot" style="height: 64px"></div>
      <div class="shot-dark" style="height: 64px; display: flex; align-items: center; justify-content: center; font-weight: 700"><span style="background: rgba(0, 0, 0, 0.45); padding: 2px 8px; border-radius: 8px">+301</span></div>
    </div>
  </section>

  <p class="caption" style="margin-top: 18px">写真をタップすると削除予定から外せます。削除した写真は「最近削除した項目」に30日間残り、iCloud写真ではほかのデバイスからも消えます。</p>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 104px">
    <button class="btn btn-delete num" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>348枚を削除</button>
  </div>

  <nav class="tabbar glass" aria-label="タブ">
    <a href="03-home.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v10"/></svg>整理</a>
    <a href="08-tray.html" class="tab" style="text-decoration: none" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>削除予定<span class="badge num">348</span></a>
    <a href="10-history.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg>実績</a>
    <a href="11-settings.html" class="tab" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>設定</a>
  </nav>
</main>
</body>
</html>
