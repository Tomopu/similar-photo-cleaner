<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スクリーンショット一括整理</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px; padding-bottom: 34px">
  <div class="nav">
    <a href="03-home.html" class="icon-btn" aria-label="戻る"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span class="nav-title">スクリーンショット</span>
    <button class="text-btn" type="button" style="font-size: 15px">全解除</button>
  </div>

  <div class="segmented" style="margin-top: 12px" role="group" aria-label="期間">
    <button type="button" aria-pressed="true">30日以上前</button>
    <button type="button" aria-pressed="false">すべて</button>
    <button type="button" aria-pressed="false">書類・レシート</button>
  </div>

  <p class="caption num" style="margin-top: 14px"><span style="color: #F3F3F0; font-weight: 600">305枚を選択中</span> · 320枚のうち · 0.3 GB</p>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px" aria-label="スクリーンショット">
    <div class="shot" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot-dark" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot" style="position: relative; height: 162px"><span class="check"></span></div>
    <div class="shot" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot-dark" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot-dark" style="position: relative; height: 162px"><span class="check"></span></div>
    <div class="shot" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot-dark" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
    <div class="shot" style="position: relative; height: 162px"><span class="check on"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg></span></div>
  </div>

  <div style="margin-top: auto">
    <button class="btn btn-delete num" type="button">305枚を削除予定に入れる</button>
  </div>
</main>
</body>
</html>
