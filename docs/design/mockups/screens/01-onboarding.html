<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>オンボーディング</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px; padding-bottom: 34px">
  <div style="position: relative; height: 250px; margin-top: 18px">
    <div class="ph p-forest" style="position: absolute; left: 70px; top: 42px; width: 150px; height: 188px; border-radius: 18px; transform: rotate(-9deg); opacity: 0.55"></div>
    <div class="ph p-sunset" style="position: absolute; left: 170px; top: 34px; width: 150px; height: 188px; border-radius: 18px; transform: rotate(8deg); opacity: 0.7"></div>
    <div class="ph p-people" style="position: absolute; left: 110px; top: 16px; width: 160px; height: 204px; border-radius: 18px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5)"></div>
    <span class="chip chip-keep" style="position: absolute; left: 124px; top: 30px">ベスト</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 28px">
    <h1 class="large-title" style="font-size: 30px">似た写真を、<br>まとめて片づける</h1>
    <p class="body">連写や撮り直しで増えた写真をグループにまとめ、残す1枚を提案します。</p>
  </div>

  <ul style="list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-direction: column; gap: 18px">
    <li style="display: flex; gap: 14px; align-items: flex-start">
      <span class="keep-text" style="margin-top: 1px"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p class="headline" style="font-size: 16px">解析はすべてiPhoneの中で</p>
        <p class="caption">写真を外部に送信することはありません</p>
      </div>
    </li>
    <li style="display: flex; gap: 14px; align-items: flex-start">
      <span class="keep-text" style="margin-top: 1px"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p class="headline" style="font-size: 16px">完全には削除しません</p>
        <p class="caption">削除は必ず確認してから。消した写真も30日間は元に戻せます</p>
      </div>
    </li>
    <li style="display: flex; gap: 14px; align-items: flex-start">
      <span class="keep-text" style="margin-top: 1px"><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p class="headline" style="font-size: 16px">スクリーンショットもまとめて</p>
        <p class="caption">古いスクショを期間でまとめて選べます</p>
      </div>
    </li>
  </ul>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button class="btn btn-keep" type="button">写真へのアクセスを許可</button>
    <p class="caption" style="text-align: center">「フルアクセス」を選ぶとライブラリ全体を整理できます</p>
  </div>
</main>
</body>
</html>
