<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>削除完了</title>
<link rel="stylesheet" href="../common.css">
</head>
<body>
<main class="screen" style="width: 390px; height: 844px; padding-bottom: 34px">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 64px; text-align: center">
    <div style="width: 76px; height: 76px; border-radius: 38px; background: var(--keep); color: var(--on-keep); display: flex; align-items: center; justify-content: center">
      <svg class="i" viewBox="0 0 24 24" style="width: 36px; height: 36px; stroke-width: 2.4"><path d="M5 12.5 10 17l9-10"/></svg>
    </div>
    <h1 class="title-2 num">348枚を削除しました</h1>
    <p class="num" style="margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -1.5px; line-height: 1">1.4<span style="font-size: 24px; font-weight: 600; letter-spacing: 0; margin-left: 4px">GB</span></p>
    <p class="body">を「最近削除した項目」に移しました</p>
  </div>

  <section class="card" style="margin-top: 36px; display: flex; flex-direction: column; gap: 14px" aria-label="容量を空けるには">
    <h2 class="headline">すぐに容量を空けるには</h2>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
      <li style="display: flex; gap: 12px; align-items: center"><span class="num" style="width: 26px; height: 26px; border-radius: 13px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">1</span><span class="body" style="color: var(--text)">写真アプリを開く</span></li>
      <li style="display: flex; gap: 12px; align-items: center"><span class="num" style="width: 26px; height: 26px; border-radius: 13px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">2</span><span class="body" style="color: var(--text)">「最近削除した項目」を開く</span></li>
      <li style="display: flex; gap: 12px; align-items: center"><span class="num" style="width: 26px; height: 26px; border-radius: 13px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">3</span><span class="body" style="color: var(--text)">「すべて削除」をタップ</span></li>
    </ol>
    <p class="caption">そのままにしても、30日後に自動で消えて容量が戻ります。</p>
  </section>

  <div style="margin-top: auto">
    <a href="03-home.html" class="btn btn-ghost" style="text-decoration: none">完了</a>
  </div>
</main>
</body>
</html>
