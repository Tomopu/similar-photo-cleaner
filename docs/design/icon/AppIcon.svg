<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F6F2"/><stop offset="1" stop-color="#E3E3DD"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FC3D9"/><stop offset="1" stop-color="#D6E4EA"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B27A"/><stop offset="1" stop-color="#E0784A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="rgba(20,22,26,0.22)"/>
    </filter>
    <clipPath id="photo"><rect x="312" y="330" width="400" height="400" rx="28"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 全体を中央に寄せる -->
  <g transform="translate(512 512) scale(1.12) translate(-512 -512) translate(-44 -14)">

  <!-- 奥の写真（削除候補）: 右上へずらして傾ける -->
  <g transform="rotate(12 600 420)" filter="url(#shadow)">
    <rect x="352" y="192" width="480" height="480" rx="52" fill="#FFFFFF"/>
    <rect x="384" y="224" width="416" height="416" rx="30" fill="url(#back)"/>
  </g>

  <!-- 手前の写真（残す1枚） -->
  <g filter="url(#shadow)">
    <rect x="280" y="298" width="464" height="464" rx="56" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#photo)">
    <rect x="312" y="330" width="400" height="400" fill="url(#sky)"/>
    <circle cx="610" cy="440" r="46" fill="#F2B38A"/>
    <path d="M312 640 L430 520 L520 600 L600 540 L712 640 L712 730 L312 730 Z" fill="#4F8FA1"/>
    <path d="M312 690 L420 610 L520 670 L640 600 L712 650 L712 730 L312 730 Z" fill="#1F4E5C"/>
  </g>

  <!-- 残す印 -->
  <g filter="url(#shadow)">
    <circle cx="716" cy="730" r="112" fill="#2F6FEB"/>
  </g>
  <path d="M662 732 L700 770 L774 692" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
